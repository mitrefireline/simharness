defaults:
  - base_env_config
  - sim: fire_simulation
  - action_space_cls: discrete
  - movements: movements_with_none
  - interactions: interactions_with_none
  - reward_cls_partial: simple

attributes: [fire_map, elevation, w_0, sigma, delta, M_x]
normalized_attributes: [elevation]

agent_speed: 9
agent_initialization_method: manual
initial_agent_positions: [[50, 50]]
