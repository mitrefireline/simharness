simulation:
  _target_: simfire.sim.simulation.FireSimulation
  config:
    _target_: simfire.utils.config.Config
    config_dict: ${simulation.eval}
movements: [up, down, left, right]
interactions: [fireline]
attributes: [fire_map, elevation, w_0, sigma, delta, M_x]
normalized_attributes: [elevation]
agent_speeds: [1,1,1,1]
deterministic: False
initial_agent_pos: [[15, 15], [1, 75], [50, 50], [75, 75]]
randomize_initial_agent_pos: [False, False, False, False]
num_agents: 4